# Core options for Minerva Console, in RetroArch's format:  key = "value"
# Lines starting with # are ignored. Options set here win over the defaults.
# Changes take effect the next time a game is started.
#
# Game Boy palette ("GB - DMG" is the green original, "GB - Light" or
# "Special 1" are alternatives; "disabled" gives grey tones):
# gambatte_gb_colorization = "internal"
# gambatte_gb_internal_palette = "GB - DMG"
#
# Game Boy Advance: "disabled" runs gpSP without its recompiler (slower,
# but useful to tell a recompiler problem from others):
# gpsp_drc = "enabled"
#
# Mega Drive: the 6-button pad is preset (X, Y, Z for fighting games). For
# the few old games that do not work with it:
# picodrive_input1 = "3 button pad"
